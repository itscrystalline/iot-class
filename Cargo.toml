[package]
name = "iot-class"
version = "0.1.0"
authors = ["itscrystalline <pvpthadgaming@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "iot-class"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["wk12"]
wk3 = []
wk4 = []
wk5 = ["dep:bh1750", "dep:embedded-hal-bus"]
wk8 = ["dep:embedded-svc"]
wk12 = ["dep:embedded-svc", "dep:bh1750", "dep:embedded-hal-bus"]
experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
anyhow = "1.0.99"
bh1750 = { version = "0.1.0", optional = true }
embedded-hal-bus = { version = "0.3.0", features = ["std"], optional = true }
embedded-hal = "1.0.0"
embedded-svc = { version = "0.28.1", optional = true }
serde = "1.0.219"
serde_json = "1.0.143"

[build-dependencies]
embuild = "0.33"

[patch.crates-io]
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal" }
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys" }
cmake = { git = "https://github.com/ivmarkov/cmake-rs" }
